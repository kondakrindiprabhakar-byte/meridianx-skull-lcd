[package]
name = "skull-lcd"
version = "0.1.1"
edition = "2021"
description = "Linux HT32 Skullsaints LCD controller with MeridianX branding"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"
rusb = { version = "0.9", features = ["vendored"] }
signal-hook = "0.3"
