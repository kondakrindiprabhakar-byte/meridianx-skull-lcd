name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install distro dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-pil python3-usb libusb-1.0-0 fonts-dejavu-core
      - name: Test rendering and protocol
        run: /usr/bin/python3 -m unittest -v
      - name: Validate installer and service
        run: |
          sh -n install.sh
          systemd-analyze verify skull-lcd.service
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
      - run: sh -n rust/install.sh && systemd-analyze verify rust/skull-lcd-rust.service
